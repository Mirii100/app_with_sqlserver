<!DOCTYPE html>
<html>
<head>
    <style>table { width: 100%; border-collapse: collapse; } th, td { border: 1px solid black; padding: 5px; font-size: 10px; }</style>
</head>
<body>
    <h1>Transaction Ledger</h1>
    <table>
        <thead><tr><th>Date</th><th>User</th><th>Type</th><th>Category</th><th>Amount</th><th>Fee</th><th>Gov Tax</th></tr></thead>
        <tbody>
            {% for r in ledger %}
            <tr>
                <td>{{ r.date|date:"Y-m-d H:i" }}</td>
                <td>{{ r.user.username|default:"" }}</td>
                <td>{{ r.type }}</td>
                <td>{{ r.category }}</td>
                <td>{{ r.amount }}</td>
                <td>{{ r.broker_fee }}</td>
                <td>{{ r.government_tax }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
