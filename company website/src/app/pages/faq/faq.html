<section class="page-hero">
  <div class="container">
    <h1>Frequently Asked Questions</h1>
    <p class="subtitle">Quick answers about accounts, loans, chamas, diaspora banking and more.</p>
    <div class="breadcrumb"><a routerLink="/">Home</a> / FAQ</div>
  </div>
</section>

<div class="container py-xl">
  <div class="faq-categories">
    <div class="faq-category" *ngFor="let cat of categories; let c = index">
      <div class="cat-heading">
        <div class="cat-icon"><i class="{{ cat.icon }}"></i></div>
        <h3>{{ cat.name }}</h3>
      </div>

      <div class="accordion">
        <div class="accordion-item" *ngFor="let item of cat.items; let i = index">
          <button class="accordion-header" type="button" (click)="openIndex = (openIndex === c * 10 + i ? -1 : c * 10 + i)">
            <span>{{ item.q }}</span>
            <i class="fa-solid fa-chevron-down accordion-chevron"></i>
          </button>
          <div class="accordion-body" *ngIf="openIndex === c * 10 + i">
            <p>{{ item.a }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="notice mt-xl">
    <h4><i class="fa-solid fa-circle-question"></i> Still have a question?</h4>
    <p>Our support team is available 24/7. Call <strong>+254 700 000 000</strong>, email <strong>support@alexiafinancials.com</strong> or visit any branch.</p>
  </div>

  <div class="text-center mt-xl">
    <a routerLink="/contact" class="btn btn-primary">Contact Us</a>
  </div>
</div>
